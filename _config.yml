# This repository is an Astro site, not a Jekyll site.
#
# GitHub Pages still triggers its legacy Jekyll builder ("pages build and
# deployment") on every push to the default branch. Jekyll walks the repo and
# reads the `---` fences that open every .astro component as YAML front
# matter, which fails the build every time:
#
#   Invalid YAML front matter in /github/workspace/src/pages/writing/index.astro
#
# Excluding the Astro sources lets that build pass. It publishes nothing —
# the live site is deployed by .github/workflows/deploy.yml, which uploads
# Astro's dist/ output.
exclude:
  - src
  - public
  - dist
  - node_modules
  - astro.config.mjs
  - tsconfig.json
  - package.json
  - package-lock.json
  - README.md
